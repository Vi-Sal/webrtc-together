spring.application.name=webrtc

call.stun-url=${CALL_STUN_URL:}
call.turn-url=${CALL_TURN_URL:}
call.turn-username=${CALL_TURN_USERNAME:}
call.turn-password=${CALL_TURN_PASSWORD:}

# Render terminates HTTPS before forwarding requests to this service.
server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Server-side only. Leave both empty to disable Telegram alerts.
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}
telegram.time-zone=${TELEGRAM_TIME_ZONE:Asia/Phnom_Penh}

# Reserve time within Render's shutdown window for the final Telegram notice.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# Check the public Render URL automatically, or localhost on other hosts, every five minutes.
health-ping.interval-ms=300000
